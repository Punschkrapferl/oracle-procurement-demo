spring:
  application:
    name: oracle-procurement-demo

  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@oracle:1521/FREEPDB1}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  packages-to-scan: com.example.oracleprocurementdemo
  paths-to-match: /api/**
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  level:
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: off