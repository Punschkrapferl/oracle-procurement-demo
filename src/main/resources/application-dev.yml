spring:
  datasource:
    url: jdbc:oracle:thin:@oracle:1521/FREEPDB1
    username: ${DB_USERNAME}
    password: REMOVED_OLD_APP_PASSWORD
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  packages-to-scan: com.example.oracleprocurementdemo
  paths-to-match: /api/**
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace