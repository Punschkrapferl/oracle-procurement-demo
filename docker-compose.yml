services:
  oracle:
    image: gvenzl/oracle-free:latest
    container_name: oracle-procurement-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      APP_USER: ${APP_USER}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 5s
    volumes:
      - oracle-procurement-data:/opt/oracle/oradata

  app:
    image: punschkrapferl23/oracle-procurement-demo:1.0.1
    container_name: oracle-procurement-app
    depends_on:
      oracle:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

volumes:
  oracle-procurement-data: