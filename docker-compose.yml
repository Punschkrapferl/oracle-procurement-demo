services:
  oracle:
    image: gvenzl/oracle-free:latest
    container_name: oracle-procurement-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: REMOVED_OLD_ROOT_PASSWORD
      APP_USER: PROCUREMENT_APP
      APP_USER_PASSWORD: REMOVED_OLD_APP_PASSWORD
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 5s
    volumes:
      - oracle-procurement-data:/opt/oracle/oradata

volumes:
  oracle-procurement-data: